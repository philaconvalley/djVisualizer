[build]
  publish = "."
  # Still no build in any meaningful sense: this writes one small file naming
  # the commit that is live, and nothing in the app reads it. It exists so CI
  # can tell whether the deploy it is about to test is the one it just pushed.
  # Without it a check running seconds after a merge tests the *previous* build
  # and reports a green that means nothing — the exact failure this project
  # already paid for once. COMMIT_REF is supplied by Netlify.
  command = "printf '{\"commit\":\"%s\"}' \"$COMMIT_REF\" > build-info.json"

[[headers]]
  for = "/*"
  # connect-src carries blob: because p5's loadImage calls fetch() on every
  # image before it decodes it, and an uploaded GIF is a blob: URL. Without it
  # every upload reads "Failed to load" (PHI-222). A blob: URL can only be made
  # by a script already running on this origin, so this admits nothing new from
  # outside. test/smoke-deploy.mjs checks it.
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob:"

[[headers]]
  for = "/gifs/*"
  # The workshop pen runs on CodePen, another origin. p5 fetches a GIF in CORS
  # mode before it decodes it, so without this header gif="https://.../gifs/x.gif"
  # fails in the pen. These are public pictures, so any origin may read them.
  # test/smoke-deploy.mjs checks every file in gifs/.
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/app/*"
  # The workshop pen on CodePen loads sandbox/engine.js as an ES module, and it
  # imports everything in app/. A browser fetches a module from another origin
  # in CORS mode, so without this header the pen gets a black stage and only a
  # console error says why. A plain <script src> needed no header; modules do
  # (PHI-163). This is public source code, so any origin may read it.
  # test/smoke-deploy.mjs checks every module the pages import.
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sandbox/*"
  # The same reason as /app/*: the pen imports sandbox/engine.js as a module.
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"
