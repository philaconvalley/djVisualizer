<!doctype html>
<!-- TEST FIXTURE for test/verify-sandbox.mjs. KEEP THESE COLOUR SPELLINGS. A named colour and a three-digit hex are
     the two things a 12-year-old is likeliest to type, and DJVisualizer.parseColor
     accepts neither on its own.
     It lives here, not in sandbox/, so that a deliberately broken page is not
     sitting in the directory students are pointed at, where it would read as
     the page they were told to open. netlify.toml publishes the repository
     root, so this file is served publicly either way. -->

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="../../sandbox/sandbox.css" />
    <script src="../../vendor/p5.min.js"></script>
    <script src="../../app/audioProcessor.js"></script>
    <script src="../../app/visualizer.js"></script>
    <script src="../../sandbox/engine.js"></script>

    <title>Sandbox fixture</title>

    <style>
      :root {
        --bass: red;
        --mid: #0f0;
        --high: rgb(10, 132, 255);
      }
    </style>
  </head>

  <body>
    <dj-visualizer dj-name="Colour Words" mode="flow" gif=""></dj-visualizer>
  </body>
</html>
