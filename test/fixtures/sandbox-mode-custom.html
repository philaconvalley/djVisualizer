<!doctype html>
<!-- TEST FIXTURE for test/verify-sandbox.mjs. The mode is `custom` with no GIF, which is
     what a student typed when the template's comment still offered them that
     word. It must fall back to a mode that draws, not to a pulsing empty square.
     It lives here, not in sandbox/, so that a deliberately odd page is not
     sitting in the directory students are pointed at, where it would read as
     the page they were told to open. netlify.toml publishes the repository
     root, so this file is served publicly either way. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="../../sandbox/sandbox.css" />
    <script src="../../vendor/p5.min.js"></script>
    <script src="../../app/audioProcessor.js"></script>
    <script src="../../app/visualizer.js"></script>
    <script src="../../sandbox/engine.js"></script>

    <title>Sandbox fixture</title>

    <style>
      :root {
        --bass: #ff453a;
        --mid: #30d158;
        --high: #0a84ff;
      }
    </style>
  </head>

  <body>
    <dj-visualizer dj-name="Custom No GIF" mode="custom" gif=""></dj-visualizer>
  </body>
</html>
