<!-- ============================ THIS BOX IS YOURS ============================
     The machine that plays the music is loaded before this box, in the pen's
     settings. That is why a mistake here can never stop the music or the
     picture.

     Change a value, then stop typing. The picture on the right updates by
     itself in a second or two. Then press Play again to bring your music back.

     Do not reload the whole page. CodePen forgets your changes when you do.

     Your colours are in the CSS box below this one. -->

<!-- Your name, your look, your boosts, and your GIF.
     mode can be: spectrum, particles, rings, waves, mandala,
                  tunnel, galaxy, polygons, flow
     gif takes over the stage when you fill it in, so it replaces mode.
     Leave gif empty to keep the mode you picked.

     The boosts set how hard each part of the music hits: bass for the
     drums, mid for the voice, high for the cymbals. 1.0 is normal.
     Go up to 3.0 to make it hit harder, or down to 0.1 to calm it.
     Try the sliders under the picture first. When you like a number,
     write it here so it stays. -->
<dj-visualizer
  dj-name="DJ NOVA"
  mode="flow"
  bass-boost="1.0"
  mid-boost="1.0"
  high-boost="1.0"
  gif=""
></dj-visualizer>

     of these notes is missing the closing arrow that ends it. The grey words
     at the bottom right of the picture tell you which one. -->
